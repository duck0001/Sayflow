.header-actions{display:flex;gap:9px;align-items:center}.small-btn{height:36px;border-radius:13px;border:1px solid var(--line);background:#ffffff0d;padding:0 12px;font-size:12px;font-weight:700}.small-btn strong{color:#ffd98d}

.bubble{position:relative;width:min(40vw,163px);height:min(40vw,163px);min-width:126px;min-height:126px;border-radius:46% 54% 61% 39% / 48% 39% 61% 52%;isolation:isolate;color:#111832;background:radial-gradient(circle at 30% 20%,#ffffffc9 0%,#ffffff51 12%,transparent 34%),linear-gradient(145deg,var(--a),var(--b));box-shadow:inset -12px -12px 24px #29314630,inset 9px 10px 19px #ffffff4d,0 19px 40px var(--glow);transform-origin:center;animation:floatblob 5s ease-in-out infinite;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;font-weight:800;font-size:19px;letter-spacing:-.04em;text-shadow:0 1px 1px #ffffff5b;transition:opacity .27s,filter .27s}
.bubble:before{content:"";position:absolute;top:16%;left:19%;width:32%;height:12%;border-radius:50%;background:#fff8;filter:blur(8px);transform:rotate(-32deg);z-index:-1}
.bubble:nth-child(2){animation-delay:-1.6s}.bubble:nth-child(3){animation-delay:-3.2s}.bubble:active{filter:brightness(1.12)}.bubble small{font-size:11px;font-weight:750;opacity:.72}.bubble.selected{animation:squish .57s cubic-bezier(.35,.01,.15,1) forwards;z-index:2}.bubble.unselected{opacity:0;filter:blur(7px);transform:scale(.6)!important;pointer-events:none}
@keyframes floatblob{0%,100%{transform:translateY(0) rotate(-2deg);border-radius:46% 54% 61% 39% / 48% 39% 61% 52%}50%{transform:translateY(-10px) rotate(3deg);border-radius:56% 44% 43% 57% / 40% 59% 41% 60%}}

.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:22px 2px 30px}.intent{border:1px solid #ffffff1b;position:relative;overflow:hidden;border-radius:26px;min-height:128px;background:linear-gradient(140deg,var(--tile),#15213b 90%);padding:19px 14px;text-align:left;display:flex;justify-content:space-between;flex-direction:column;transition:transform .2s,border-color .2s}.intent:hover{border-color:#ffffff58}.intent:active{transform:scale(.95)}.intent:after{content:"";position:absolute;right:-29px;top:-34px;width:95px;height:95px;border-radius:50%;background:#ffffff13;box-shadow:0 0 33px #ffffff15}.intent .icon{font-size:24px}.intent strong{font-size:17px}.intent small{font-size:11px;color:#c5cddd;line-height:1.45;margin-top:4px}

.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:20px 0 17px}.filters::-webkit-scrollbar{display:none}.filter{flex:none;border:1px solid var(--line);border-radius:100px;padding:11px 14px;font-size:12px;background:#ffffff10;color:#c8d2e1}.filter.active{background:#dceafc;color:#1b2844;border-color:#dceafc;font-weight:800}
.chunk{border-radius:22px;background:linear-gradient(133deg,#192745,#111a30 90%);border:1px solid #ffffff1a;padding:18px 16px;margin:0 0 12px;box-shadow:0 9px 26px #00000016}.chunk-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.chunk-tag{font-size:10px;color:#b8caed;font-weight:700;letter-spacing:.03em}.heart{font-size:21px;padding:4px 5px;color:#8d9aaf;background:transparent}.heart.saved{color:#ffc785}.en{font-size:clamp(19px,5.5vw,23px);font-weight:750;line-height:1.42;letter-spacing:-.026em;margin:12px 0 8px}.jp{font-size:13px;color:#cfdaeb;margin:0;line-height:1.65}.note{margin:11px 0 0;border-left:2px solid #7796ba;padding-left:9px;font-size:11px;color:#9fb1c9;line-height:1.65}.chunk-actions{display:flex;gap:8px;margin-top:16px}.action{display:flex;justify-content:center;align-items:center;gap:7px;border-radius:12px;padding:12px 16px;background:#ffffff12;border:1px solid #ffffff12;font-weight:800;font-size:12px;min-width:105px}.action.primary{background:#e2e7fb;color:#202b47;border-color:#e2e7fb}.action:active{transform:scale(.96)}.action svg{width:15px;height:15px;flex:none}

/* v1.1 — iOS Safari: avoid repeatedly morphing border-radius, which can cause flicker.
   The at-rest motion is a slow compositor-friendly translation; the jelly effect happens only on tap. */
.bubble{animation:none;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.bubble:not(.selected):not(.unselected){animation:gentleFloat 9s ease-in-out infinite;will-change:transform;}
.bubble:nth-child(2):not(.selected):not(.unselected){animation-delay:-3s;}
.bubble:nth-child(3):not(.selected):not(.unselected){animation-delay:-6s;}
.bubble.unselected{animation:none;}
.bubble.selected{animation:tapJelly .62s cubic-bezier(.28,.04,.2,1) forwards;}
@keyframes gentleFloat{
  0%,100%{transform:translate3d(0,0,0)}
  50%{transform:translate3d(0,-5px,0)}
}
@keyframes tapJelly{
  0%{transform:scale3d(1,1,1);opacity:1;}
  26%{transform:scale3d(1.12,.88,1);}
  48%{transform:scale3d(.93,1.12,1);}
  70%{transform:scale3d(1.08,.96,1);}
  100%{transform:scale3d(1.34,1.34,1);opacity:0;filter:blur(7px);}
}
html[data-bubble-motion="off"] .bubble:not(.selected):not(.unselected){animation:none;will-change:auto;}
.motion-heading{margin-top:25px;}
@media(prefers-reduced-motion:reduce){.bubble:not(.selected):not(.unselected){animation:none!important;}}

// Keep an utterance alive until speech ends. On some mobile engines a local-only
// utterance can be collected; also avoid cancelling the engine on every first tap.
let activeUtterance=null;
let speechCheckTimer=null;
function say(text){
  const synth=window.speechSynthesis;
  if(!synth||!('SpeechSynthesisUtterance' in window)){
    notice('このブラウザは音声再生に対応していません');
    return;
  }
  const spoken=text.replace(/\[([^\]]+)\]/g,'$1').trim();
  if(!spoken)return;
  try{
    if(synth.speaking||synth.pending)synth.cancel();
    const u=new SpeechSynthesisUtterance(spoken);
    activeUtterance=u;
    u.lang='en-US';
    u.rate=speed;
    u.pitch=1;
    const voices=synth.getVoices();
    const us=voices.find(v=>v.lang.toLowerCase().replace('_','-')==='en-us');
    if(us)u.voice=us;
    let started=false;
    if(speechCheckTimer)clearTimeout(speechCheckTimer);
    u.onstart=()=>{
      if(activeUtterance!==u)return;
      started=true;
      if(speechCheckTimer)clearTimeout(speechCheckTimer);
      notice('英語音声を再生しています');
    };
    u.onend=()=>{
      if(activeUtterance===u){activeUtterance=null;if(speechCheckTimer)clearTimeout(speechCheckTimer);}
    };
    u.onerror=(e)=>{
      if(activeUtterance!==u)return;
      activeUtterance=null;
      if(speechCheckTimer)clearTimeout(speechCheckTimer);
      notice('音声エラー: '+(e.error||'不明')+'。Safariの設定をご確認ください');
    };
    // This call remains inside the user's tap handler (mobile autoplay policies).
    synth.speak(u);
    if(synth.paused)synth.resume();
    speechCheckTimer=setTimeout(()=>{
      if(activeUtterance===u&&!started)notice('音声が始まりません。音量・消音・出力先を確認してください');
    },3000);
  }catch(e){activeUtterance=null;notice('音声再生に失敗しました。Safariから試してください');}
}
async function copyText(s){try{if(!navigator.clipboard?.writeText)throw Error('fallback');await navigator.clipboard.writeText(s);notice('コピーしました')}catch(e){const text=document.createElement('textarea');text.value=s;text.style.position='fixed';text.style.opacity='0';document.body.appendChild(text);text.select();const ok=document.execCommand('copy');text.remove();notice(ok?'コピーしました':'コピーできませんでした')}}
function favToggle(key,btn){if(saved.includes(key)){saved=saved.filter(x=>x!==key);notice('お気に入りを解除しました')}else{saved.push(key);notice('お気に入りに保存しました')}store('sayflow_favs_v1',saved);const on=saved.includes(key);btn.classList.toggle('saved',on);btn.textContent=on?'★':'☆';btn.setAttribute('aria-pressed',String(on));btn.setAttribute('aria-label',on?'お気に入り解除':'お気に入りに保存');document.getElementById('favCount').textContent=saved.length;}
main.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;
if(btn.dataset.exMoremenu){state.exMore=!state.exMore;render();return}
if(btn.dataset.exMode){state.exMode=btn.dataset.exMode;state.exStep=Math.min(state.exStep,(explanationFlows[state.quickId]?.steps.length||1)-1);state.exHint=false;state.exReveal=false;state.exStarted=false;state.exSeconds=null;exStartTime=null;render();return}
if(btn.dataset.exStep!==undefined){state.exStep=Number(btn.dataset.exStep);state.exReveal=false;state.exHint=false;state.exStarted=false;state.exSeconds=null;exStartTime=null;render();return}
if(btn.dataset.exNext){state.exStep=(state.exStep+1)%explanationFlows[state.quickId].steps.length;render();return}
if(btn.dataset.exFlowtoggle){state.exMore=!state.exMore;render();return}
if(btn.dataset.exLevel){state.exLevel=Number(btn.dataset.exLevel);state.exDrillIndex=0;state.exHint=false;state.exReveal=false;state.exStarted=false;state.exSeconds=null;exStartTime=null;render();return}
if(btn.dataset.exStart){exStartTime=performance.now();state.exStarted=true;state.exSeconds=null;render();return}
if(btn.dataset.exSpoke){if(exStartTime!==null){state.exSeconds=Math.max(0,(performance.now()-exStartTime)/1000);exStartTime=null;}render();return}
if(btn.dataset.exHint){state.exHint=!state.exHint;render();return}
if(btn.dataset.exReveal){state.exReveal=!state.exReveal;render();return}
if(btn.dataset.exResult){trainingHistory.push({topic:state.quickId,level:state.exLevel,result:btn.dataset.exResult,seconds:state.exSeconds,when:new Date().toISOString()});trainingHistory=trainingHistory.slice(-300);store('sayflow_extrain_v13',trainingHistory);const msg={solo:'自力で言えた！',hint:'ヒントを使って言えた',saw:'答えを確認した'}[btn.dataset.exResult];
 if(state.exLevel===1)state.exStep=(state.exStep+1)%explanationFlows[state.quickId].steps.length;else if(state.exLevel===2)state.exDrillIndex++;else state.exDrillIndex++;
 state.exHint=false;state.exReveal=false;state.exStarted=false;state.exSeconds=null;exStartTime=null;render();notice(msg+' · 記録しました');return}
if(btn.dataset.quicktype){go({screen:'quickmenu',quickType:btn.dataset.quicktype,quickId:null,intent:null,flowVariants:{},exMore:false,filter:'all',expanded:false});return}
if(btn.dataset.quicklink){go({screen:'quickmenu',quickType:btn.dataset.quicklink,quickId:null,intent:null,flowVariants:{},filter:'all',expanded:false});return}
if(btn.dataset.quickid){const id=btn.dataset.quickid;if(state.quickType==='explain')go({screen:'explain',quickId:id,flowVariants:{},exMode:'live',exStep:0,exLevel:1,exDrillIndex:0,exHint:false,exReveal:false,exMore:false,exStarted:false,exSeconds:null});else{go({screen:'results',quickId:id,intent:id,filter:'all',expanded:false})}return}
if(btn.dataset.cycle!==undefined){const i=Number(btn.dataset.cycle);const step=explanationFlows[state.quickId]?.steps[i];if(!step)return;state.flowVariants={...state.flowVariants,[i]:((state.flowVariants[i]||0)+1)%(1+(step[4]||[]).length)};render();return}
if(btn.dataset.copyflow){copyText(currentFlowLines().join('\n'));return}
if(btn.dataset.entry){go({screen:'category',entry:btn.dataset.entry,group:null,mood:null,intent:null,filter:'all',expanded:false});return}
if(btn.dataset.bubble){chooseBubble(btn);return}
if(btn.dataset.intent){state.expanded=false;state.intent=btn.dataset.intent;remember();go({screen:'results'});return}
if(btn.dataset.filter){state.filter=btn.dataset.filter;state.expanded=false;render();return}
if(btn.dataset.more){state.expanded=!state.expanded;render();return}
if(btn.dataset.save){favToggle(btn.dataset.save,btn);return}
if(btn.dataset.say){say(btn.dataset.say);return}
if(btn.dataset.copy){copyText(btn.dataset.copy);return}
if(btn.dataset.recent){const item=recent[Number(btn.dataset.recent)];if(!item)return;go({screen:'results',entry:item.entry,group:item.group,mood:item.mood,intent:item.intent,filter:item.group||'all',expanded:false});return}
if(btn.dataset.reveal){state.revealed=!state.revealed;render();return}
if(btn.dataset.nextPractice){state.practiceIndex++;state.revealed=false;render();return}
if(btn.dataset.speed){speed=Number(btn.dataset.speed);store('sayflow_speed_v1',speed);render();notice('速度を変更しました');return}
if(btn.dataset.motion){bubbleMotion=btn.dataset.motion;document.documentElement.dataset.bubbleMotion=bubbleMotion;store('sayflow_bubble_motion_v1',bubbleMotion);render();notice(bubbleMotion==='gentle'?'バブルをゆっくり動かします':'バブルの浮遊を停止しました');return}
if(btn.dataset.open){const dest=btn.dataset.open;if(dest==='intent'){if(state.quickType&&state.quickId){goBack();return}state.screen==='results'?goBack():go({screen:'intent'});return}go({screen:dest,practiceIndex:0,revealed:false});return}
});
main.addEventListener('input',e=>{if(e.target.id==='searchInput'){state.query=e.target.value;const result=document.getElementById('searchResults');result.innerHTML=searchCardContent(state.query);document.getElementById('searchCount').textContent=state.query?'検索結果':'おすすめのフレーズ'}});
back.addEventListener('click',goBack);
home.addEventListener('click',reset);
document.getElementById('replyButton').addEventListener('click',()=>{if(!isBusy)go({screen:'quickmenu',quickType:'reply',quickId:null,intent:null,flowVariants:{},filter:'all',expanded:false})});
fav.addEventListener('click',()=>{if(!isBusy&&state.screen!=='saved')go({screen:'saved'})});
find.addEventListener('click',()=>{if(!isBusy&&state.screen!=='search')go({screen:'search'})});
help.addEventListener('click',()=>{if(!isBusy&&state.screen!=='guide')go({screen:'guide'})});
render();
if('serviceWorker'in navigator && location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
